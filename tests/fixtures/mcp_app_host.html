<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test local du pont MCP Apps</title>
<style>body{font:15px system-ui;margin:20px;background:#eee}iframe{width:100%;height:720px;border:1px solid #aaa}button{padding:10px;margin-right:8px}#status{padding:12px}</style></head>
<body><h1>Simulation locale de l’hôte MCP Apps</h1><p>Fixture de test du protocole. Cette page ne représente pas ChatGPT et ne contient pas de données en direct.</p>
<button id="deliver">Livrer le résultat MCP</button><button id="dark">Thème sombre</button><button id="light">Thème clair</button>
<div id="status" role="status">En attente de ui/initialize</div><iframe title="Application Montréal embarquée" src="../../tools/mtl/dashboard.html"></iframe>
<script>
const frame=document.querySelector('iframe'),status=document.getElementById('status');
const data={query:'Hôtel de Ville de Montréal',address:'Hôtel de Ville de Montréal (fixture)',radius_m:800,view:'all',retrieved_at:new Date().toISOString(),sections:Object.fromEntries(['weather','requests311','parking','snowparking','roadworks','bixi','stm','parks','restaurants','tourism','avis','murals','rem','ecocentres','events'].map(key=>[key,{items:[]}]))};
data.sections.parks={parks:[{name:'Lieu public de test',distance_m:100,openstreetmap_url:'https://www.openstreetmap.org/?mlat=45.5088&mlon=-73.5541'}],source:'https://donnees.montreal.ca/'};
function send(message){frame.contentWindow.postMessage({jsonrpc:'2.0',...message},location.origin);}
window.addEventListener('message',event=>{
 if(event.source!==frame.contentWindow||event.data?.jsonrpc!=='2.0')return;
 const m=event.data;
 if(m.method==='ui/initialize'){send({id:m.id,result:{protocolVersion:'2026-01-26',hostInfo:{name:'Local protocol fixture',version:'1.0.0'},hostCapabilities:{serverTools:{},openLinks:{}},hostContext:{theme:'light'}}});}
 else if(m.method==='ui/notifications/initialized'){status.textContent='Pont initialisé';}
 else if(m.method==='tools/call'){send({id:m.id,result:{structuredContent:data,content:[{type:'text',text:'Résultat de fixture'}]}});status.textContent='tools/call reçu et traité';}
 else if(m.method==='ui/open-link'){status.textContent='ui/open-link : '+m.params.url;send({id:m.id,result:{}});}
});
document.getElementById('deliver').onclick=()=>send({method:'ui/notifications/tool-result',params:{structuredContent:data,content:[]}});
for(const theme of ['dark','light'])document.getElementById(theme).onclick=()=>send({method:'ui/notifications/host-context-changed',params:{theme}});
</script></body></html>
