[project]
name = "donneesqc-mcp"
description = "Serveur MCP pour les données ouvertes du Québec — Données Québec, Ville de Montréal et services géospatiaux IGO."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dynamic = ["version"]
authors = [
    { name = "mcsÉdition", email = "contact@mcsedition.org" },
]
keywords = ["mcp", "open-data", "quebec", "ckan", "donnees-ouvertes", "geospatial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp[cli]>=1.9.0",
    "httpx>=0.28.0",
    "uvicorn>=0.34.0",
    "sentry-sdk[httpx]>=2.19.0",
    "defusedxml>=0.7.1",
    "pyproj>=3.6.0",
    "beautifulsoup4>=4.12.0",
    "sqlglot>=26.0.0",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
    "pre-commit>=4.0.0",
    "pip-audit>=2.7.0",
    "bandit>=1.8.0",
    "detect-secrets>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/Stefen-Taime/donneesqc-mcp"
Repository = "https://github.com/Stefen-Taime/donneesqc-mcp"
Issues = "https://github.com/Stefen-Taime/donneesqc-mcp/issues"

[build-system]
requires = ["setuptools>=75.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
write_to = "_version.py"
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["helpers*", "tools*"]
exclude = ["tests*", "scripts*", "skills*", "docs*"]
namespaces = false

[tool.vercel]
entrypoint = "asgi:app"

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "ICN", "PIE", "PT", "RSE", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLW", "TRY", "FLY", "PERF", "RUF"]
ignore = ["S101", "S104", "TRY003", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["tools", "helpers"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "network: hits live upstream APIs (excluded from default make test)",
]
addopts = "-m \"not network\""

[tool.bandit]
exclude_dirs = ["tests", ".venv", "scripts", "docs"]
# B101: asserts in non-test code are rare; B104: MCP binds 0.0.0.0 by design;
# B608: CKAN SQL strings are schema-derived then validated via sqlglot (see SECURITY.md).
skips = ["B101", "B104", "B608"]
